workflows:
  android-build:
    name: Build Android APK
    instance_type: mac_mini_m1
    max_build_duration: 30
    scripts:
      - name: Build Android APK
        script: |
          chmod +x gradlew || true
          ./gradlew assembleDebug --stacktrace
    artifacts:
      - app/build/outputs/apk/**/*.apk
